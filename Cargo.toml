[package]
name = "cauce"
version = "0.9.1"
default-run = "cauce"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "An independent bounded HTTP reverse proxy"

[features]
fuzzing = []

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
httpdate = "1"
anyhow = "1"
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip", "brotli"] }
bytes = "1"
base64 = "0.22"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
fs2 = "0.4"
libc = "0.2"
ipnet = "2.12"
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
sha1 = "0.10"
time = { version = "=0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
uuid = { version = "=1.18.1", features = ["v4"] }
yaml_serde = "=0.10.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
