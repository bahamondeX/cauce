[package]
name = "cauce"
version = "0.9.1"
default-run = "cauce"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "An independent bounded network gateway"

[features]
default = ["full"]
core = []
web = ["core", "dep:async-compression"]
network = ["core", "stream"]
edge = ["web", "quic", "acme"]
application = ["core"]
full = ["edge", "network", "application", "mail"]
stream = ["core"]
quic = ["core", "dep:quinn", "dep:h3", "dep:h3-quinn"]
mail = ["core"]
acme = ["core", "dep:instant-acme", "dep:x509-parser"]
fuzzing = []

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
httpdate = "1"
anyhow = "1"
async-compression = { version = "0.4", optional = true, default-features = false, features = ["tokio", "gzip", "brotli"] }
bytes = "1"
base64 = "0.22"
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http-body-util = "0.1"
hickory-resolver = { version = "=0.26.4", default-features = false, features = ["tokio"] }
hyper = { version = "1.12", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
fs2 = "0.4"
libc = "0.2"
ipnet = "2.12"
instant-acme = { version = "=0.8.5", optional = true, default-features = false, features = ["ring", "rcgen", "hyper-rustls"] }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
quinn = { version = "0.11.12", optional = true, default-features = false, features = ["runtime-tokio", "rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
sha1 = "0.10"
sha2 = "0.10"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
uuid = { version = "=1.18.1", features = ["v4"] }
yaml_serde = "=0.10.7"
x509-parser = { version = "=0.18.1", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
