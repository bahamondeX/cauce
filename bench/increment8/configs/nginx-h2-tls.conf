worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
  access_log off;
  limit_conn_zone $server_name zone=global_requests:10m;
  client_max_body_size 16m;
  client_header_timeout 5s;
  send_timeout 15s;
  keepalive_requests 100000;
  upstream h2_backend {
    server backend-h2:8443 max_conns=32;
    keepalive 32;
    keepalive_timeout 15s;
    keepalive_time 60s;
    keepalive_requests 100000;
  }
  server {
    server_name proxy proxy.test;
    listen 8443 ssl;
    http2 on;
    http2_max_concurrent_streams 16;
    ssl_certificate /certs/proxy.crt;
    ssl_certificate_key /certs/proxy.key;
    limit_conn global_requests 32;
    limit_conn_status 503;
    limit_conn_log_level info;
    location / {
      proxy_pass https://h2_backend;
      proxy_http_version 2;
      proxy_set_header Connection "";
      proxy_set_header Host backend.test;
      proxy_ssl_server_name on;
      proxy_ssl_name backend.test;
      proxy_ssl_trusted_certificate /certs/ca.crt;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_connect_timeout 1s;
      proxy_send_timeout 15s;
      proxy_read_timeout 15s;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_next_upstream off;
    }
  }
}
