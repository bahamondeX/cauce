global
    nbthread 1
    maxconn 128

defaults
    mode http
    timeout connect 1s
    timeout client 15s
    timeout server 15s
    timeout http-request 5s
    timeout http-keep-alive 15s
    timeout queue 1s
    retries 0

frontend fixture
    bind 0.0.0.0:8080
    default_backend echo

backend echo
    http-reuse safe
    http-request set-header Host backend.test:8000
    server fixture backend:8000 maxconn 32 pool-max-conn 32
