[package]
name = "cauce-load"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "=1.0.104"
bytes = "=1.12.1"
hdrhistogram = { version = "=7.6.0", default-features = false }
http-body-util = "=0.1.5"
hyper = { version = "=1.13.0", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "tokio", "http1", "http2"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "macros", "sync", "time", "net"] }
url = "=2.5.9"
