[package]
name = "cauce-load"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "=1.0.104"
bytes = "=1.12.1"
hdrhistogram = { version = "=7.6.0", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["http2", "rustls-tls-manual-roots", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "macros", "sync", "time", "net"] }
