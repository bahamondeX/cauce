name="bench-cauce"
listen="0.0.0.0:8443"
admin="127.0.0.1:9090"
[tls]
cert_file="/certs/proxy.crt"
key_file="/certs/proxy.key"
[limits]
clients=128
requests=32
connections=32
idle_connections=32
connecting=32
acquire_ms=1000
connect_ms=1000
tls_handshake_ms=5000
headers_ms=15000
stream_idle_ms=15000
request_ms=15000
client_headers_ms=5000
idle_connection_ms=15000
max_connection_age_ms=60000
dns_cache_ms=5000
tcp_keepalive_secs=30
max_header_bytes=16384
max_headers=64
max_body_bytes=16777216
shutdown_ms=5000
[logs]
enabled=true
path="/var/log/cauce/access.jsonl"
queue=4096
rotate_bytes=16777216
retained_files=3
[[upstreams]]
id="backend"
address="backend:8443"
host="backend.test:8443"
isolation="increment7-http1-tls"
connections=32
idle_connections=32
failure_backoff_ms=100
tls={server_name="backend.test",ca_file="/certs/ca.crt"}
[[routes]]
id="api"
host="proxy:8443"
path_prefix="/"
balance="round_robin"
upstreams=["backend"]
