services:
  proxy:
    volumes:
      - ./bench/cauce.toml:/etc/cauce/cauce.toml:ro
    environment:
      TOKIO_WORKER_THREADS: 2
  nginx:
    image: nginx:1.30.6
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["./bench/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [node]
    cpus: 2
    mem_limit: 256m
