protocols = imap pop3
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
first_valid_uid = 1001
mail_location = maildir:/fixture/mail
passdb {
  driver = passwd-file
  args = scheme=PLAIN /fixture/passwd
}
userdb {
  driver = static
  args = uid=1001 gid=1001 home=/fixture/mail
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
log_path = /dev/stderr
