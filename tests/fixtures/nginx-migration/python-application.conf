events {}
http {
    server {
        listen 127.0.0.1:8080;
        server_name python.example.test;
        location /wsgi/ {
            uwsgi_param SCRIPT_NAME /wsgi;
            uwsgi_pass 127.0.0.1:3031;
        }
        location /scgi/ {
            scgi_param SCRIPT_NAME /scgi;
            scgi_pass 127.0.0.1:4000;
        }
    }
}
