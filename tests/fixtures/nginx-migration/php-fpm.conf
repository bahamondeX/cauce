events {}
http {
    server {
        listen 127.0.0.1:8080;
        server_name php.example.test;
        root /srv/www/cauce-fixture;
        index index.php;
        location ~ \.php$ {
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }
    }
}
