              - {"name": "contact", "flags": ["NGX_CONF_TAKE1"], "within": "acme_issuer"}
              - {"name": "external_account_key", "flags": ["NGX_CONF_TAKE2"], "within": "acme_issuer"}
              - {"name": "preferred_chain", "flags": ["NGX_CONF_TAKE1"], "within": "acme_issuer"}
              - {"name": "profile", "flags": ["NGX_CONF_TAKE12"], "within": "acme_issuer"}
              - {"name": "ssl_trusted_certificate", "flags": ["NGX_CONF_TAKE1"], "within": "acme_issuer"}
              - {"name": "ssl_verify", "flags": ["NGX_CONF_FLAG"], "within": "acme_issuer"}
              - {"name": "state_path", "flags": ["NGX_CONF_TAKE1"], "within": "acme_issuer"}
              - {"name": "accept_terms_of_service", "flags": ["NGX_CONF_NOARGS"], "within": "acme_issuer"}
behaviors:
  - {"id": "uwsgi-wsgi", "status": "verified", "scope": "GET, upload hash, redirect, application error and slow streaming through native uWSGI against NGINX 1.30.8.", "tests": ["tests/application/test_wsgi.py"], "evidence": ["bench/program/evidence/milestone-8/wsgi-darwin.log"]}
  - {"id": "scgi-wsgi", "status": "verified", "scope": "GET, upload hash, redirect, application error and slow streaming through native SCGI against NGINX 1.30.8.", "tests": ["tests/application/test_wsgi.py"], "evidence": ["bench/program/evidence/milestone-8/wsgi-darwin.log"]}
  - {"id": "smtp-submission-auth", "status": "verified", "scope": "Postfix 3.7.11 STARTTLS, PLAIN login and post-auth NOOP via Cauce and NGINX 1.30.8.", "tests": ["tests/mail/test_mail.py"], "evidence": ["bench/program/evidence/milestone-8/mail-darwin.log"]}
  - {"id": "imap-starttls-login", "status": "verified", "scope": "Dovecot 2.3.19.1 STARTTLS, LOGIN and INBOX selection via Cauce and NGINX 1.30.8.", "tests": ["tests/mail/test_mail.py"], "evidence": ["bench/program/evidence/milestone-8/mail-darwin.log"]}
  - {"id": "pop3-stls-login", "status": "verified", "scope": "Dovecot 2.3.19.1 STLS, USER/PASS and STAT via Cauce and NGINX 1.30.8.", "tests": ["tests/mail/test_mail.py"], "evidence": ["bench/program/evidence/milestone-8/mail-darwin.log"]}
  - {"id": "fastcgi-php-fpm", "status": "verified", "scope": "Shared PHP-FPM GET, POST, multipart, redirect, cookie, large body and 500 response behavior against NGINX 1.30.8.", "tests": ["tests/application/test_application.py"], "evidence": ["bench/program/evidence/milestone-8/fastcgi-darwin.log"]}
  - {"id": "http3-shared-static-response", "status": "verified", "scope": "An independent aioquic client validates HTTPS authority, QUIC Retry, TLS 1.3 and a shared 200 response body against NGINX 1.30.8.", "tests": ["tests/http3/interop.py"], "evidence": ["bench/program/evidence/milestone-7/http3-darwin.log"]}
  - {"id": "stream-tcp-weight-and-half-close", "status": "verified", "scope": "Stream TCP half-close and weighted 3:1 distribution against NGINX 1.30.8.", "tests": ["tests/stream/interop.py"], "evidence": ["bench/program/evidence/milestone-7/layer4-darwin.log"]}
  - {"id": "stream-udp-echo", "status": "verified", "scope": "Stream UDP echo datagram boundaries against NGINX 1.30.8.", "tests": ["tests/stream/interop.py"], "evidence": ["bench/program/evidence/milestone-7/layer4-darwin.log"]}
  - {"id": "stream-tls-preread", "status": "verified", "scope": "Stream TLS visible SNI and default routing against NGINX 1.30.8.", "tests": ["tests/stream/interop.py"], "evidence": ["bench/program/evidence/milestone-7/layer4-darwin.log"]}
  - {"id": "stream-proxy-v1-identity", "status": "verified", "scope": "Trusted Stream PROXY v1 source identity and body preservation against NGINX 1.30.8.", "tests": ["tests/stream/interop.py"], "evidence": ["bench/program/evidence/milestone-7/layer4-darwin.log"]}
  - {"id": "trusted-real-ip", "status": "verified", "scope": "Recursive IPv4 and IPv6 forwarding, X-Real-IP, rejection of spoofed chains and final-route CIDR authorization.", "tests": ["tests/compare_nginx_gateway.py"], "evidence": ["bench/program/evidence/milestone-5/gateway-compact.jsonl", "bench/program/evidence/milestone-5/gateway-sharded.jsonl"]}
  - {"id": "bounded-gateway-actions", "status": "verified", "scope": "Capture and query handling, local 308, named locations and internal hop exhaustion.", "tests": ["tests/compare_nginx_gateway.py"], "evidence": ["bench/program/evidence/milestone-5/gateway-compact.jsonl", "bench/program/evidence/milestone-5/gateway-sharded.jsonl"]}
  - {"id": "weighted-gateway-selection", "status": "verified", "scope": "3:1 weighted distribution and stable address selection in shared socket cases; algorithms remain partially mapped.", "tests": ["tests/compare_nginx_gateway.py"], "evidence": ["bench/program/evidence/milestone-5/gateway-compact.jsonl", "bench/program/evidence/milestone-5/gateway-sharded.jsonl"]}
  - {"id": "bounded-gateway-admission", "status": "verified", "scope": "Shared request limits, HTTP/2 concurrency and reload persistence, physical peer socket recovery.", "tests": ["tests/compare_nginx_gateway.py"], "evidence": ["bench/program/evidence/milestone-5/gateway-compact.jsonl", "bench/program/evidence/milestone-5/gateway-sharded.jsonl"]}
  - {"id": "http-1.1-forwarding", "status": "verified", "scope": "Origin-form HTTP/1.1, request and response streaming, keepalive", "tests": ["tests/integration.py", "tests/resilience/proxy_failures.py"], "evidence": ["bench/program/evidence/candidate-integration-darwin-arm64.log"]}
  - {"id": "http-2-forwarding", "status": "verified", "scope": "ALPN and prior knowledge, stream quotas, cancellation and connection reuse. Known-empty upstream uploads end in initial HEADERS and zero-data uploads with trailers forward those trailers.", "tests": ["scripts/test-http2-docker.py", "scripts/test-http2-stress-docker.py", "scripts/test-http2-headers-docker.py"], "evidence": ["bench/program/evidence/candidate-http2-linux-arm64.json", "bench/program/evidence/milestone-2/http2-eos-candidate.json", "bench/program/evidence/milestone-2/http2-eos-linux-regression.tar.gz"]}
  - {"id": "http-2-header-observer", "status": "verified", "scope": "Absolute framing deadline for partial headers and continuation; bounded observer under an address-sanitized fuzz campaign", "tests": ["src/transport.rs", "fuzz/fuzz_targets/header_observer.rs"], "evidence": ["bench/program/evidence/fuzz-recovered-linux-arm64.log.gz"]}
  - {"id": "grpc", "status": "partial", "scope": "Native gRPC cleartext and TLS, deadlines, trailers and backpressure", "tests": ["scripts/test-http2-docker.py", "bench/increment8/gate_h2.mjs"], "evidence": ["bench/program/evidence/candidate-http2-linux-arm64.json", "bench/program/evidence/milestone-2/http2-eos-candidate.json"]}
  - {"id": "websocket", "status": "partial", "scope": "HTTP/1.1 upgrade tunnel, bounded idle and lifetime, base RFC6455 framing passthrough", "tests": ["scripts/test-websocket-edges.py"]}
  - {"id": "routing", "status": "partial", "scope": "Exact and edge-wildcard authorities with exact path and segment-aware prefix routing", "tests": ["src/routing.rs", "tests/integration.py", "tests/compare_nginx_routing.py"], "evidence": ["bench/program/evidence/milestone-3/routing-nginx.jsonl"]}
  - {"id": "flat-location-precedence", "status": "verified", "scope": "Top-level exact, literal prefix, ^~, and first matching ASCII byte regex precedence on validated shared paths.", "tests": ["src/routing.rs", "tests/compare_nginx_routing.py"], "evidence": ["bench/program/evidence/milestone-4/nginx-differential.jsonl"]}
  - {"id": "static-route-header-edits", "status": "verified", "scope": "Static request replacement and removal and response header replacement and removal, route isolation, protected headers and rejected reload.", "tests": ["src/headers.rs", "tests/integration.py", "tests/compare_nginx_routing.py"], "evidence": ["bench/program/evidence/milestone-4/nginx-differential.jsonl"]}
