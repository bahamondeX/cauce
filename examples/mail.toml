name = "cauce"
admin = "127.0.0.1:9090"

[limits]
clients = 1024
requests = 256
connections = 64
idle_connections = 32
connecting = 8
acquire_ms = 250
connect_ms = 1000
headers_ms = 5000
stream_idle_ms = 15000
request_ms = 120000
client_headers_ms = 5000
idle_connection_ms = 10000
max_connection_age_ms = 60000
dns_cache_ms = 5000
tcp_keepalive_secs = 30
max_header_bytes = 32768
max_headers = 64
max_body_bytes = 16777216
shutdown_ms = 5000

[logs]
enabled = false
path = "logs/access.jsonl"
queue = 4096
rotate_bytes = 16777216
retained_files = 3

[[mail]]
listen = "127.0.0.1:1587"
protocol = "smtp"
tls_mode = "starttls"
auth_http = "http://127.0.0.1:9080/auth"
auth_mechanisms = ["plain", "login"]
auth_timeout_ms = "15s"
[mail.tls]
cert_file = "/etc/cauce/mail/localhost.pem"
key_file = "/etc/cauce/mail/localhost-key.pem"
[[mail.backends]]
address = "127.0.0.1:2525"

[[mail]]
listen = "127.0.0.1:1993"
protocol = "imap"
tls_mode = "implicit"
auth_http = "http://127.0.0.1:9080/auth"
auth_mechanisms = ["login", "plain"]
auth_timeout_ms = "15s"
[mail.tls]
cert_file = "/etc/cauce/mail/localhost.pem"
key_file = "/etc/cauce/mail/localhost-key.pem"
[[mail.backends]]
address = "127.0.0.1:1143"

[[mail]]
listen = "127.0.0.1:1110"
protocol = "pop3"
tls_mode = "starttls"
auth_http = "http://127.0.0.1:9080/auth"
auth_mechanisms = ["user_pass"]
auth_timeout_ms = "15s"
[mail.tls]
cert_file = "/etc/cauce/mail/localhost.pem"
key_file = "/etc/cauce/mail/localhost-key.pem"
[[mail.backends]]
address = "127.0.0.1:2110"
