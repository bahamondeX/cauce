# yaml-language-server: $schema=../schemas/cauce.schema.json
version: 1
proxy:
  name: cauce
  admin: "127.0.0.1:9090"

  limits:
    clients: 1024
    requests: 256
    connections: 64
    idle_connections: 32
    connecting: 8
    acquire_ms: 250ms
    connect_ms: 1s
    headers_ms: 5s
    stream_idle_ms: 15s
    request_ms: 2m
    client_headers_ms: 5s
    idle_connection_ms: 10s
    max_connection_age_ms: 1m
    dns_cache_ms: 5s
    tcp_keepalive_secs: 30s
    max_header_bytes: 32KiB
    max_headers: 64
    max_body_bytes: 16MiB
    shutdown_ms: 5s

  logs:
    enabled: false
    path: logs/access.jsonl
    queue: 4096
    rotate_bytes: 16MiB
    retained_files: 3

  listeners:
    - listen: "127.0.0.1:8080"
    - listen: "127.0.0.1:8443"
      tls:
        cert_file: work/http3/tls.pem
        key_file: work/http3/tls.key
  http3:
    listen: "127.0.0.1:8443"
    advertise: true
    max_connections: 128
    max_streams: 32
    idle_timeout: 30s
    connection_timeout: 1h
    tls:
      cert_file: work/http3/tls.pem
      key_file: work/http3/tls.key
      versions: [tls1.3]
  routes:
    - id: welcome
      host: "localhost:8443"
      path_prefix: /
      content: { type: direct, status: 200, body: Cauce HTTPS and HTTP/3 }
    - id: cleartext
      host: "localhost:8080"
      path_prefix: /
      content: { type: direct, status: 200, body: Cauce HTTP }
