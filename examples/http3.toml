name = "cauce"
admin = "127.0.0.1:9090"

[limits]
clients = 1024
requests = 256
connections = 64
idle_connections = 32
connecting = 8
acquire_ms = 250
connect_ms = 1000
headers_ms = 5000
stream_idle_ms = 15000
request_ms = 120000
client_headers_ms = 5000
idle_connection_ms = 10000
max_connection_age_ms = 60000
dns_cache_ms = 5000
tcp_keepalive_secs = 30
max_header_bytes = 32768
max_headers = 64
max_body_bytes = 16777216
shutdown_ms = 5000

[logs]
enabled = false
path = "logs/access.jsonl"
queue = 4096
rotate_bytes = 16777216
retained_files = 3

[[listeners]]
listen = "127.0.0.1:8080"

[[listeners]]
listen = "127.0.0.1:8443"
[listeners.tls]
cert_file = "work/http3/tls.pem"
key_file = "work/http3/tls.key"

[http3]
listen = "127.0.0.1:8443"
advertise = true
max_connections = 128
max_streams = 32
idle_timeout = "30s"
connection_timeout = "1h"
[http3.tls]
cert_file = "work/http3/tls.pem"
key_file = "work/http3/tls.key"
versions = ["tls1.3"]

[[routes]]
id = "welcome"
host = "localhost:8443"
path_prefix = "/"
[routes.content]
type = "direct"
status = 200
body = "Cauce HTTPS and HTTP/3"

[[routes]]
id = "cleartext"
host = "localhost:8080"
path_prefix = "/"
[routes.content]
type = "direct"
status = 200
body = "Cauce HTTP"
