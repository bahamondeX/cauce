# yaml-language-server: $schema=../schemas/cauce.schema.json
version: 1
proxy:
  name: cauce
  listen: "127.0.0.1:8080"
  admin: "127.0.0.1:9090"

  limits:
    clients: 1024
    requests: 256
    connections: 64
    idle_connections: 32
    connecting: 8
    acquire_ms: 250ms
    connect_ms: 1s
    headers_ms: 5s
    stream_idle_ms: 15s
    request_ms: 2m
    client_headers_ms: 5s
    idle_connection_ms: 10s
    max_connection_age_ms: 1m
    dns_cache_ms: 5s
    tcp_keepalive_secs: 30s
    max_header_bytes: 32768
    max_headers: 64
    max_body_bytes: 16777216
    shutdown_ms: 5s

  logs:
    enabled: true
    path: logs/access.jsonl
    queue: 4096
    rotate_bytes: 16777216
    retained_files: 3

  upstreams:
    - id: python
      address: "127.0.0.1:8000"
      host: "localhost:8000"
      isolation: default
      connections: 32
      idle_connections: 16
      failure_backoff_ms: 500ms
    - id: node
      address: "127.0.0.1:8001"
      host: "localhost:8001"
      isolation: default
      connections: 32
      idle_connections: 16
      failure_backoff_ms: 500ms

  routes:
    - id: exact-api
      host: "api.example.test:8080"
      path_prefix: /
      balance: round_robin
      upstreams: [python]
    - id: tenant-suffix
      host: "*.example.test:8080"
      path_prefix: /
      balance: round_robin
      upstreams: [node]
    - id: mail-prefix
      host: "mail.*:8080"
      path_prefix: /
      balance: round_robin
      upstreams: [python]
    - id: exact-health
      host: "*.example.test:8080"
      path_prefix: /health
      path_match: exact
      balance: round_robin
      upstreams: [python]
