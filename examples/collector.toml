# Optional local collector. This file intentionally has no remote endpoint.
[collector]
access_log = "/var/log/cauce/access.jsonl"
state_path = "/var/lib/cauce/collector/state.db"
delivery = "spool"
spool_max_bytes = 8388608
db_max_bytes = 12582912
batch_max_events = 128
batch_max_bytes = 524288
max_line_bytes = 262144
max_files = 32
poll_ms = 500
backoff_min_ms = 500
backoff_max_ms = 30000
request_timeout_ms = 10000
# To enable only the explicitly experimental adapter:
# delivery = "proposal-http"
# endpoint = "https://collector.example.invalid/proposed-ingest"
# token_file = "/run/secrets/cauce-collector-token"
# ca_file = "/etc/ssl/private/connectivity-ingest-ca.pem"
