# yaml-language-server: $schema=../schemas/cauce.schema.json
version: 1
proxy:
  name: cauce
  admin: "127.0.0.1:9090"

  limits:
    clients: 1024
    requests: 256
    connections: 64
    idle_connections: 32
    connecting: 8
    acquire_ms: 250ms
    connect_ms: 1s
    headers_ms: 5s
    stream_idle_ms: 15s
    request_ms: 2m
    client_headers_ms: 5s
    idle_connection_ms: 10s
    max_connection_age_ms: 1m
    dns_cache_ms: 5s
    tcp_keepalive_secs: 30s
    max_header_bytes: 32KiB
    max_headers: 64
    max_body_bytes: 16MiB
    shutdown_ms: 5s

  logs:
    enabled: false
    path: logs/access.jsonl
    queue: 4096
    rotate_bytes: 16MiB
    retained_files: 3

  mail:
    - listen: "127.0.0.1:1587"
      protocol: smtp
      tls_mode: starttls
      tls:
        cert_file: /etc/cauce/mail/localhost.pem
        key_file: /etc/cauce/mail/localhost-key.pem
      auth_http: "http://127.0.0.1:9080/auth"
      auth_mechanisms: [plain, login]
      backends:
        - address: "127.0.0.1:2525"
      auth_timeout_ms: 15s
    - listen: "127.0.0.1:1993"
      protocol: imap
      tls_mode: implicit
      tls:
        cert_file: /etc/cauce/mail/localhost.pem
        key_file: /etc/cauce/mail/localhost-key.pem
      auth_http: "http://127.0.0.1:9080/auth"
      auth_mechanisms: [login, plain]
      backends:
        - address: "127.0.0.1:1143"
      auth_timeout_ms: 15s
    - listen: "127.0.0.1:1110"
      protocol: pop3
      tls_mode: starttls
      tls:
        cert_file: /etc/cauce/mail/localhost.pem
        key_file: /etc/cauce/mail/localhost-key.pem
      auth_http: "http://127.0.0.1:9080/auth"
      auth_mechanisms: [user_pass]
      backends:
        - address: "127.0.0.1:2110"
      auth_timeout_ms: 15s
