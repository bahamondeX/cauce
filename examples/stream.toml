name = "cauce"
admin = "127.0.0.1:9090"

[limits]
clients = 1024
requests = 256
connections = 64
idle_connections = 32
connecting = 8
acquire_ms = 250
connect_ms = 1000
headers_ms = 5000
stream_idle_ms = 15000
request_ms = 120000
client_headers_ms = 5000
idle_connection_ms = 10000
max_connection_age_ms = 60000
dns_cache_ms = 5000
tcp_keepalive_secs = 30
max_header_bytes = 32768
max_headers = 64
max_body_bytes = 16777216
shutdown_ms = 5000

[logs]
enabled = false
path = "logs/access.jsonl"
queue = 4096
rotate_bytes = 16777216
retained_files = 3

[[stream.upstreams]]
id = "postgres"
balance = "consistent_hash"
endpoints = [{ address = "127.0.0.1:5432", weight = 2 }, { unix = "/tmp/.s.PGSQL.5432" }]

[[stream.upstreams]]
id = "database_tls"
endpoints = [{ address = "127.0.0.1:9443" }]

[[stream.upstreams]]
id = "dns"
endpoints = [{ address = "[::1]:5353" }]

[[stream.tcp]]
listen = "127.0.0.1:15432"
upstream = "postgres"
[stream.tcp.options]
connect_timeout = "5s"
idle_timeout = "10m"
session_timeout = "1h"
max_sessions = 256
max_sessions_per_ip = 64
keepalive_secs = 30

[[stream.tls_passthrough]]
listen = "127.0.0.1:8443"
preread_timeout = "2s"
preread_bytes = 32768
default_upstream = "database_tls"
routes = [{ sni = "database.example.com", alpn = "postgresql", upstream = "database_tls" }]

[[stream.udp]]
listen = "[::1]:1053"
upstream = "dns"
[stream.udp.options]
idle_timeout = "10s"
session_timeout = "1m"
max_sessions = 1024
max_sessions_per_ip = 64
max_datagram_bytes = 1232
max_response_ratio = 3
