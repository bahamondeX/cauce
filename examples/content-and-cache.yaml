# yaml-language-server: $schema=../schemas/cauce.schema.json
version: 1
proxy:
  name: cauce
  listen: "127.0.0.1:8080"
  admin: "127.0.0.1:9090"

  limits:
    clients: 1024
    requests: 256
    connections: 64
    idle_connections: 32
    connecting: 8
    acquire_ms: 250ms
    connect_ms: 1s
    headers_ms: 5s
    stream_idle_ms: 15s
    request_ms: 2m
    client_headers_ms: 5s
    idle_connection_ms: 10s
    max_connection_age_ms: 1m
    dns_cache_ms: 5s
    tcp_keepalive_secs: 30s
    max_header_bytes: 32KiB
    max_headers: 64
    max_body_bytes: 16MiB
    shutdown_ms: 5s

  logs:
    enabled: true
    path: logs/access.jsonl
    queue: 4096
    rotate_bytes: 16MiB
    retained_files: 3

  upstreams:
    - id: origin
      address: "127.0.0.1:8000"
      host: "localhost:8000"
      isolation: public
      connections: 32
      idle_connections: 16
      failure_backoff_ms: 500ms
  routes:
    - id: site
      host: "localhost:8080"
      path_prefix: /
      content:
        type: static
        root: "${CAUCE_DOCUMENT_ROOT}"
        index: [index.html]
        etag: true
        precompressed: true
        cache_control: public, max-age=300
        expires_seconds: 300
      compression:
        algorithms: [br, gzip]
        min_size: 1KiB
    - id: public-api
      host: "localhost:8080"
      path_prefix: /public
      upstreams: [origin]
      cache:
        max_size: 64MiB
        max_entry_size: 256KiB
        ttl: 60s
        stale_if_error: 1m
        stale_while_revalidate: 10s
        background_revalidate_ms: 2s
        coalesce: true
        vary: [accept-encoding]
    - id: status
      host: "localhost:8080"
      path_prefix: /status
      path_match: exact
      content: {type: direct, status: 200, body: ready}
