# yaml-language-server: $schema=../schemas/cauce.schema.json
version: 1
proxy:
  name: cauce
  listen: "127.0.0.1:8080"
  admin: "127.0.0.1:9090"

  limits:
    clients: 1024
    requests: 256
    connections: 64
    idle_connections: 32
    connecting: 8
    acquire_ms: 250ms
    connect_ms: 1s
    headers_ms: 5s
    stream_idle_ms: 15s
    request_ms: 2m
    client_headers_ms: 5s
    idle_connection_ms: 10s
    max_connection_age_ms: 1m
    dns_cache_ms: 5s
    tcp_keepalive_secs: 30s
    max_header_bytes: 32KiB
    max_headers: 64
    max_body_bytes: 16MiB
    shutdown_ms: 5s

  logs:
    enabled: false
    path: logs/access.jsonl
    queue: 4096
    rotate_bytes: 16MiB
    retained_files: 3

  upstreams:
    - id: php
      address: unix:/run/php/app.sock
      host: php.internal
      isolation: php-app
      protocol: fastcgi
      connections: 16
      idle_connections: 4
      failure_backoff_ms: 500ms
  routes:
    - id: php
      host: "localhost:8080"
      path_prefix: /php
      upstreams: [php]
      application:
        document_root: /srv/php
        script: index.php
        script_name: /php/index.php
        keep_connection: true
